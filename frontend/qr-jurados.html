<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exmi — Acceso al chatbot</title>
<style>
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#0d1420;color:#e2e8f0;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;padding:20px;
  }
  .card{
    background:#131d2e;border:1px solid #27364f;border-radius:16px;
    padding:32px 28px;max-width:420px;width:100%;text-align:center;
  }
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px;margin:0 0 20px}
  .marco{
    background:#fff;border-radius:12px;padding:10px;
    display:inline-block;margin-bottom:16px;
  }
  .marco img{width:250px;height:250px;display:block}
  a.enlace{color:#c8102e;word-break:break-all;font-size:13px;text-decoration:none}
  .btn{
    display:inline-block;margin-top:16px;background:#c8102e;color:#fff;
    font-weight:700;padding:13px 22px;border-radius:10px;text-decoration:none;
  }
  small{display:block;color:#94a3b8;font-size:12px;line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Exmi — Colegio Albert Einstein</h1>
  <p class="sub">Asistente escolar · Cúcuta, Colombia</p>

  <div class="marco">
    <img src="qr-chatbot.png" alt="QR para abrir el chatbot de Exmi"/>
  </div>

  <a class="enlace" href="https://exmi-colegio.vercel.app">exmi-colegio.vercel.app</a><br/>
  <a class="btn" href="https://exmi-colegio.vercel.app">Abrir chatbot</a>

  <small>
    El chatbot es público: no necesita contraseña.<br/>
    Acceso docente: credenciales entregadas por el colegio.
  </small>
</div>
</body>
</html>
